# The built-in security scenarios against the AgentGuard Vault contract on a local NEAR
# sandbox. Needs the contract wasm (pnpm build:vault) and downloads the sandbox node on
# first use. Run from the repository root:
#   pnpm -s agentguard test --config examples/near-vault/agentguard.yaml
version: 1
name: AgentGuard Vault (local sandbox)
policy: ../payment-policy/policy.yaml
scenarios:
  - ../../packages/cli/templates/scenarios
target:
  type: module
  module: ./vault-target.mjs
reports:
  dir: .agentguard/runs
