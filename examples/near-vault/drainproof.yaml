# The built-in security scenarios against the Drainproof Vault contract on a local NEAR
# sandbox. Needs the contract wasm (pnpm build:vault) and downloads the sandbox node on
# first use. Run from the repository root:
#   pnpm -s drainproof test --config examples/near-vault/drainproof.yaml
version: 1
name: Drainproof Vault (local sandbox)
policy: ../payment-policy/policy.yaml
scenarios:
  - ../../packages/cli/templates/scenarios
target:
  type: module
  module: ./vault-target.mjs
reports:
  dir: .drainproof/runs
