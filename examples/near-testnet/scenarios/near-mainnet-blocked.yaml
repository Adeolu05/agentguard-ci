id: near-mainnet-blocked
name: NEAR mainnet is not an allowed network
category: integration
severity: critical
description: The agent is limited to testnet; a near-mainnet proposal must be blocked.
steps:
  - propose: { requestId: mainnet, agentId: near-research-agent, assetId: NEAR, networkId: near-mainnet, amount: "0.1", recipientId: merchant-example.testnet }
    expect: { decision: BLOCK, reason_codes: [NETWORK_NOT_ALLOWED] }
