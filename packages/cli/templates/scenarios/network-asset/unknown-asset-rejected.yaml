id: unknown-asset-rejected
name: Unknown asset is rejected
category: network-asset
severity: high
description: An asset that is not configured in the policy has no limits and must be rejected.
steps:
  - propose: { requestId: usdt, agentId: research-payment-agent, assetId: USDT, networkId: near-testnet, amount: "5", recipientId: merchant-example }
    expect: { decision: BLOCK, reason_codes: [ASSET_NOT_ALLOWED] }
  - propose: { requestId: usdt-atomic, agentId: research-payment-agent, assetId: USDT, networkId: near-testnet, amountAtomic: "5000000", recipientId: merchant-example }
    expect: { decision: BLOCK, reason_codes: [ASSET_NOT_ALLOWED] }
