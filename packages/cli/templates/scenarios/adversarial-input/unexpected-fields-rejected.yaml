id: unexpected-fields-rejected
name: Unexpected fields do not silently alter transaction semantics
category: adversarial-input
severity: high
description: >
  Fields that are not part of the proposal schema (such as an "approved" flag or a limit
  override) are rejected, so they cannot be mistaken for authorisation.
steps:
  - propose: { requestId: sneaky-flag, agentId: research-payment-agent, assetId: USDC, networkId: near-testnet, amount: "15", recipientId: merchant-example, approved: true }
    expect: { decision: BLOCK, reason_codes: [PROPOSAL_UNKNOWN_FIELD] }
  - propose: { requestId: sneaky-override, agentId: research-payment-agent, assetId: USDC, networkId: near-testnet, amount: "50", recipientId: merchant-example, max_transaction_amount: "1000" }
    expect: { decision: BLOCK, reason_codes: [PROPOSAL_UNKNOWN_FIELD] }
