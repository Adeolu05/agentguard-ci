id: concurrent-requests-respect-daily-limit
name: Concurrent requests cannot collectively exceed the daily limit
category: state-concurrency
severity: critical
description: >
  With 50 USDC already spent, ten simultaneous 10 USDC payments are submitted. Only five fit
  in the 100 USDC daily limit; the rest must be blocked even though each one alone is valid.
remediation: Make the limit check and the reservation a single atomic operation (lock, transaction or compare-and-set).
given:
  ledger:
    - { amount: "50", asset: USDC, status: confirmed }
steps:
  - concurrent:
      count: 10
      proposal: { requestId: burst, agentId: research-payment-agent, assetId: USDC, networkId: near-testnet, amount: "10", recipientId: merchant-example }
    expect:
      decisions: { ALLOW: 5, BLOCK: 5 }
  - expect_ledger: { asset: USDC, active_amount: "100", reservations_created: 5 }
