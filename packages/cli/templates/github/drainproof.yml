# Drainproof security tests for agent transaction policies.
# Requires @drainproof/cli as a devDependency (see docs/adoption.md) and a committed lockfile.
# Third-party actions are pinned to full commit SHAs (tag shown in the comment).
name: Drainproof

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: drainproof-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drainproof:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # pnpm projects: uncomment the next line and replace `npm ci` below with `pnpm install --frozen-lockfile`.
      # - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - name: Validate policy and scenarios
        run: |
          npx --no-install drainproof policy validate
          npx --no-install drainproof scenarios validate
      - name: Run Drainproof security suite
        run: npx --no-install drainproof test --no-color --json drainproof-report.json --markdown drainproof-report.md --github-summary
      - name: Upload report
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drainproof-report
          path: |
            drainproof-report.json
            drainproof-report.md
          if-no-files-found: ignore
          retention-days: 14
