[package]
name = "drainproof-vault"
description = "Drainproof Vault: an on-chain spending guard for AI agents on NEAR"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/Adeolu05/drainproof"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.30.0"

[dev-dependencies]
near-sdk = { version = "=5.30.0", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
